name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的正式版本标签，例如 v0.3.15"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.commit.outputs.sha }}
      docker_enabled: ${{ steps.version.outputs.docker_enabled }}
    steps:
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          ARTEX_DOCKER_IMAGE: ${{ vars.ARTEX_DOCKER_IMAGE }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "正式版本必须是 v主版本.次版本.修订号，例如 v0.3.15" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          # Docker 镜像发布是可选集成：没有 Docker Hub 凭据时不应阻断二进制与 Release。
          # 变量缺省 → docker_enabled=false → docker / docker-publish 跳过。
          if [[ -z "$ARTEX_DOCKER_IMAGE" ]]; then
            echo "docker_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 ARTEX_DOCKER_IMAGE，跳过 Docker 镜像发布（二进制与 GitHub Release 不受影响）"
          elif [[ ! "$ARTEX_DOCKER_IMAGE" =~ ^[a-z0-9][a-z0-9_-]*/[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "ARTEX_DOCKER_IMAGE 格式不合法，应为 Docker Hub 用户名/镜像名：$ARTEX_DOCKER_IMAGE" >&2
            exit 1
          else
            echo "docker_enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
      - name: Pin release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ① 前端静态导出（一次），产物给交叉编译各平台复用
  frontend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

  # ② 五平台交叉编译（内嵌前端）+ 打 zip
  binaries:
    needs: [prepare, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ needs.prepare.outputs.tag }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # UPX 自解压 ELF 在部分 Linux 内核、虚拟化和安全策略下会崩溃。
          # Release 使用 Go linker 裁剪和 zip 压缩，优先保证可移植性。
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: |
          bash build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/artex-linux-amd64/artex -h
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"
      # linux-amd64 的一键部署包（install.sh + start.sh + skills）随 Release 发布
      - name: Upload linux-amd64 deploy package
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: pkg-linux-amd64-deploy
          path: "dist/*.deploy.tar.gz"
      # Linux 生二进制单独上传，供 docker job 复用（免在镜像里重编前端+Go）
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/artex-linux-${{ matrix.goarch }}/artex

  # ③ 汇总所有 zip → 创建 GitHub Release
  release:
    needs: [prepare, binaries, docker-publish]
    # Docker 是可选的：变量未配置时 docker-publish 为 skipped，Release 仍须产出。
    if: |
      always()
      && needs.prepare.result == 'success'
      && needs.binaries.result == 'success'
      && (
        needs.docker-publish.result == 'success'
        || (needs.prepare.outputs.docker_enabled == 'false' && needs.docker-publish.result == 'skipped')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: |
          version="${RELEASE_TAG#v}"
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            test -s "artex-${version}-${target}.zip"
          done
          sha256sum *.zip *.deploy.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Inspect existing release
        id: guard
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          echo "publish=true" >> "$GITHUB_OUTPUT"
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > /tmp/artex-release.json 2>/tmp/artex-release.err; then
            draft=$(jq -r .isDraft /tmp/artex-release.json)
            target=$(jq -r '.targetCommitish // empty' /tmp/artex-release.json)
            if [[ "$draft" != "true" ]]; then
              if [[ "$target" == "$RELEASE_COMMIT" ]]; then
                # 重跑同一条 tag 不应把流水线染红：已发布就跳过后续上传。
                echo "::notice::${RELEASE_TAG} 已发布且指向当前提交，跳过重复发布"
                echo "publish=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "标签已移动到新提交，删除旧 Release 后重新创建 $RELEASE_TAG"
              gh release delete "$RELEASE_TAG" --yes
            fi
          elif ! grep -qi 'release not found\|HTTP 404' /tmp/artex-release.err; then
            cat /tmp/artex-release.err >&2
            exit 1
          fi
      - name: Compose release body
        if: steps.guard.outputs.publish == 'true'
        run: |
          version="${RELEASE_TAG#v}"
          {
            echo "## artex-ld ${version}"
            echo
            echo "### 程序包"
            echo
            echo "- Linux：AMD64 / ARM64（zip，另附 linux-amd64 一键部署包）"
            echo "- macOS：AMD64 / ARM64（zip）"
            echo "- Windows：AMD64（zip）"
            echo "- 校验：\`SHA256SUMS\`（覆盖全部 zip 与部署包）"
            if [[ "${{ needs.prepare.outputs.docker_enabled }}" == "true" ]]; then
              echo "- Docker Hub：\`${{ vars.ARTEX_DOCKER_IMAGE }}:${RELEASE_TAG}\`（同时提供 \`latest\`）"
            fi
            echo
            echo "### 说明"
            echo
            echo "- 部署、在线更新与配置迁移见 [README](https://github.com/${GH_REPO}#readme)。"
            echo "- 升级前请先备份 PostgreSQL；启动时会幂等重跑 schema。"
            echo "- 仅限合法授权、自有系统与隔离靶场使用。"
          } > dist/RELEASE_BODY.md
      - uses: softprops/action-gh-release@v2
        if: steps.guard.outputs.publish == 'true'
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.commit }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.deploy.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          body_path: dist/RELEASE_BODY.md
      - name: Publish complete release
        if: steps.guard.outputs.publish == 'true'
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

  # GITHUB_TOKEN 发布的 Release 不会再次触发 release: published 工作流。
  # 直接依赖发布 job，保证 ZIP、校验文件和镜像全部发布成功后才更新 Demo。
  demo:
    needs: [prepare, release]
    if: needs.release.result == 'success'
    uses: ./.github/workflows/demo.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      commit: ${{ needs.prepare.outputs.commit }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  # ④ 在原生 AMD64 / ARM64 runner 上构建和测试，再推送架构镜像。
  docker:
    needs: [prepare, binaries]
    if: needs.prepare.outputs.docker_enabled == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex-ci-test
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4 # 取 Dockerfile 与 skills/
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image for native smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: artex:smoke
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - name: Test application startup and embedded frontend
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          docker run --rm --entrypoint /app/artex artex:smoke -h
          docker run -d --name artex-smoke --network host \
            -e ARTEX_PG_DSN='postgres://artex:artex-ci-test@127.0.0.1:5432/artex?sslmode=disable' artex:smoke
          trap 'docker logs artex-smoke; docker rm -f artex-smoke' EXIT
          curl --fail --retry 30 --retry-connrefused --retry-delay 2 --max-time 3 \
            http://127.0.0.1:8787/api/health > /tmp/artex-health.json
          jq -e '. == {"ok": true}' /tmp/artex-health.json
          curl --fail -H 'Content-Type: application/json' \
            --data '{"password":"smoke-test-admin-password"}' \
            http://127.0.0.1:8787/api/auth/init > /tmp/artex-auth.json
          token=$(jq -er '.token' /tmp/artex-auth.json)
          echo "::add-mask::$token"
          curl --fail -H "Authorization: Bearer $token" \
            http://127.0.0.1:8787/api/version > /tmp/artex-version.json
          jq -e --arg version "${RELEASE_TAG#v}" '.version == $version' /tmp/artex-version.json
          curl --fail http://127.0.0.1:8787/ > /tmp/artex-index.html
          grep -qi '<!doctype html' /tmp/artex-index.html
      - name: Push tested architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ vars.ARTEX_DOCKER_IMAGE }}:${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha,scope=docker-${{ matrix.arch }}

  # ⑤ 只有两种架构都通过启动验证，才发布正式版本和 latest 镜像。
  docker-publish:
    needs: [prepare, docker]
    if: |
      always()
      && needs.prepare.outputs.docker_enabled == 'true'
      && needs.docker.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish multi-platform image
        env:
          IMAGE: ${{ vars.ARTEX_DOCKER_IMAGE }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$RELEASE_TAG" --tag "$IMAGE:latest" \
            "$IMAGE:$RELEASE_TAG-amd64" "$IMAGE:$RELEASE_TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --raw > /tmp/artex-manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | index("amd64") != null and index("arm64") != null' /tmp/artex-manifest.json
